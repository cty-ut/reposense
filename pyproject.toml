[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reposense"
version = "0.1.0"
description = "Agent that turns a GitHub issue into a verified contribution plan for first-time contributors"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx",
    "click",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
reposense = "reposense.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
